<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probator — Mockup applicativo</title>
<style>
:root{--canvas:#f5f5f2;--surface:#fff;--subtle:#f0f0ed;--ink:#252723;--muted:#686b63;--border:#dedfd8;--accent:#e66b28;--accent-soft:#fff0e6;--green:#287047;--green-soft:#edf7ef;--red:#b34239;--red-soft:#fff0ee;--blue:#356b96;--blue-soft:#edf4fb;--warning:#8b6422;--warning-soft:#fcf5df;--fast:120ms;--normal:180ms;--slow:240ms;--ease:cubic-bezier(.2,0,0,1);color-scheme:light}
[data-theme="dark"]{--canvas:#1c1e1b;--surface:#242723;--subtle:#2b2e29;--ink:#eceee7;--muted:#b0b5aa;--border:#42473e;--accent:#f38a4b;--accent-soft:#3d2e23;--green:#91c7a2;--green-soft:#263c2e;--red:#f3a29a;--red-soft:#422c29;--blue:#9fc6ec;--blue-soft:#273848;--warning:#dfc28c;--warning-soft:#3e3726;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:6px 12px;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}button:hover{background:var(--subtle)}button.primary{background:var(--accent);color:#191c18;border-color:var(--accent);font-weight:600}button.primary:hover{filter:brightness(1.06)}button.quiet{border-color:transparent;background:transparent}button:disabled{opacity:.5;cursor:default}a{color:inherit;text-decoration:none}h1{font-size:24px;line-height:1.3;letter-spacing:-.6px;margin:0 0 5px;font-weight:650}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0}p{margin:0}.muted{color:var(--muted)}.small{font-size:12px}.mono{font:12px/1.5 ui-monospace,SFMono-Regular,monospace}.flex{display:flex;align-items:center;gap:8px}.spread{justify-content:space-between}.wrap{flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:20px;padding:0 6px;border-radius:4px;white-space:nowrap}.passed{color:var(--green);background:var(--green-soft)}.failed{color:var(--red);background:var(--red-soft)}.running{color:var(--blue);background:var(--blue-soft)}.blocked{color:var(--warning);background:var(--warning-soft)}.tag{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:3px;padding:0 5px;color:var(--muted);background:var(--subtle)}
.review{background:var(--ink);color:var(--canvas);padding:8px 20px;display:flex;align-items:center;gap:14px;font-size:12px;min-height:48px}.review strong{white-space:nowrap}.review select,.review button{background:var(--surface);color:var(--ink);border:0;font-size:12px}.review .note{margin-left:auto;opacity:.75}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 48px)}aside{border-right:1px solid var(--border);background:var(--subtle);padding:24px 12px;display:flex;flex-direction:column;gap:24px}.brand{padding:0 12px;font-size:21px;font-weight:700;letter-spacing:-.8px}.brand b{color:var(--accent)}.workspace{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:4px}.avatar{height:27px;width:27px;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border);border-radius:4px;font-weight:600}.nav-label{padding:0 12px;margin-bottom:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}nav button{display:block;text-align:left;width:100%;border:0;background:transparent;padding:8px 12px;margin:2px 0}nav button.selected{background:var(--surface);box-shadow:inset 3px 0 var(--accent);font-weight:600}nav button span{float:right;font-size:12px;color:var(--muted)}.aside-bottom{margin-top:auto;border-top:1px solid var(--border);padding:16px 12px 0}.topbar{height:54px;border-bottom:1px solid var(--border);background:var(--surface);padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.crumb{display:flex;gap:10px}.crumb b{color:var(--ink);font-weight:500}main{padding:28px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.search{min-width:240px;border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:6px 10px}.toolbar .count{margin-left:auto}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:20px}.tabs button{border:0;border-radius:0;background:transparent;padding:10px 0;color:var(--muted)}.tabs button.active{color:var(--ink);box-shadow:inset 0 -2px var(--accent);font-weight:600}.table-wrap{border:1px solid var(--border);border-radius:6px;overflow:auto;background:var(--surface)}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:12px;font-weight:500;color:var(--muted);background:var(--subtle);padding:10px 16px}td{padding:16px;border-top:1px solid var(--border);vertical-align:middle}tbody tr:hover{background:var(--canvas)}.project-name{display:flex;gap:14px;align-items:center}.thumbnail{width:74px;height:50px;background:var(--subtle);border:1px solid var(--border);border-radius:3px;flex-shrink:0;padding:5px;display:grid;grid-template-columns:13px 1fr;gap:4px}.thumbnail:before{content:"";background:var(--border)}.thumbnail div{display:grid;gap:3px}.thumbnail i{display:block;background:var(--border);height:7px}.thumbnail i:first-child{background:var(--accent);width:65%}.project-link{font-weight:600;cursor:pointer}.project-link:hover{text-decoration:underline}.project-description{margin-top:3px;color:var(--muted);font-size:12px}.project-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:12px 16px;background:var(--accent-soft);margin:20px 0;font-size:12px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.column{background:var(--subtle);border:1px solid var(--border);border-radius:6px;padding:12px;min-height:475px}.column-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:600}.column-title .number{color:var(--muted);font-weight:400;margin-left:8px}.test-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px;transition:background var(--fast) var(--ease)}.test-card:hover{border-color:var(--muted)}.test-card h3{margin:7px 0 10px;font-weight:600}.test-card .card-meta{margin-top:13px;border-top:1px solid var(--border);padding-top:9px}.test-card .card-top{font-size:11px;color:var(--muted)}.test-card .card-top button{font-size:13px;padding:0 4px}.add{width:100%;color:var(--muted);border-style:dashed;background:transparent;text-align:left}.board-tip{font-size:12px;margin-top:18px;color:var(--muted)}.mobile-column{display:none}.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.field{display:block;margin-bottom:17px;font-size:12px;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:8px 10px;margin-top:6px;font-weight:400;font-size:14px}.field textarea{min-height:76px;resize:vertical}.step-editor{display:grid;grid-template-columns:28px 1fr;gap:12px;border-top:1px solid var(--border);padding:16px 0}.step-number{width:25px;height:25px;background:var(--subtle);border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;line-height:24px}.step-editor .field{margin-bottom:10px}.definition-note{margin-top:18px;font-size:12px;color:var(--muted)}.execution-summary{display:flex;gap:24px;flex-wrap:wrap;padding:16px 20px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.execution-summary div{border-right:1px solid var(--border);padding-right:24px}.execution-summary div:last-child{border:0}.execution-summary span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.execution-grid{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(340px,1.1fr);gap:20px}.result-row{padding:12px 0;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:13px}.result-row:first-of-type{border:0}.result-row .badge{margin-left:auto}.result-detail{background:var(--red-soft);border:1px solid var(--border);border-radius:4px;padding:14px;margin:4px 0 14px}.result-detail dl{margin:0}.result-detail dt{font-size:11px;color:var(--muted);margin:10px 0 3px}.result-detail dt:first-child{margin:0}.result-detail dd{margin:0;font-size:12px}.final-checks{margin-top:24px}.evidence-tabs{margin:-6px 0 16px}.browser-bar{background:var(--subtle);border:1px solid var(--border);padding:8px 12px;border-radius:4px 4px 0 0;display:flex;gap:8px;align-items:center;font-size:11px}.browser-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.browser-page{border:1px solid var(--border);border-top:0;padding:22px;background:var(--canvas);min-height:278px}.store-head{font-size:12px;letter-spacing:2px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:22px}.order-box{background:var(--surface);border:1px solid var(--border);padding:18px;max-width:320px;margin:auto}.order-item{display:flex;gap:12px;margin:16px 0}.item-square{height:48px;width:48px;background:var(--subtle);border:1px solid var(--border)}.order-total{border-top:1px solid var(--border);padding-top:12px;margin-top:18px}.unavailable{padding:10px;background:var(--subtle);color:var(--muted);text-align:center;margin-top:14px;border:1px dashed var(--border)}.player{padding:12px;border:1px solid var(--border);border-top:0;background:var(--subtle)}.timeline{height:4px;background:var(--border);margin-bottom:12px;position:relative}.timeline:after{content:"";width:72%;display:block;height:4px;background:var(--accent)}.evidence-caption{margin-top:12px;font-size:12px;color:var(--muted)}.live-mark{border-left:3px solid var(--blue);padding:10px;background:var(--blue-soft);font-size:12px;margin-bottom:16px}.motion-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.motion-grid .panel{min-height:215px}.motion-demo{height:95px;display:flex;align-items:center;justify-content:center;background:var(--subtle);border:1px solid var(--border);border-radius:4px;margin:14px 0}.motion-menu{background:var(--surface);border:1px solid var(--border);padding:12px;border-radius:4px;animation:enter var(--normal) var(--ease)}@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.motion-demo .moving{width:90px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;transition:transform var(--normal) var(--ease)}.motion-demo .moving.moved{transform:translateX(50px)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:12px 18px;border-radius:6px;z-index:20;font-size:12px}.toast[hidden]{display:none}.empty{padding:60px;text-align:center;color:var(--muted)}.reduced *{animation:none!important;transition:none!important}.reduced .moving.moved{transform:none}.doc-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
@media(max-width:1000px){.shell{grid-template-columns:180px 1fr}main{padding:22px}.execution-grid{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr}.motion-grid{grid-template-columns:1fr 1fr}.review .note{display:none}.board{gap:10px}.column{padding:8px}.test-card{padding:10px}}
@media(max-width:650px){.review{flex-wrap:wrap;padding:8px 12px;gap:6px}.review strong{font-size:11px}.shell{grid-template-columns:1fr}aside{display:none}.topbar{padding:0 16px;height:48px}main{padding:20px 16px}.heading{flex-wrap:wrap;margin-bottom:18px}h1{font-size:22px}.toolbar{flex-wrap:wrap}.search{min-width:0;width:100%}.toolbar .count{margin-left:0}.board{grid-template-columns:1fr}.column{min-height:0;padding:12px}.column:not(.mobile-active){display:none}.mobile-column{display:block;width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);margin-bottom:14px}.tabs{gap:18px}.execution-grid{display:block}.execution-grid>.panel{margin-bottom:16px}.execution-summary{gap:12px;padding:14px}.execution-summary div{padding-right:12px}.motion-grid{grid-template-columns:1fr}.topbar .user{display:none}td,th{padding:12px}.project-url,.project-stats{display:none}.project-name{gap:10px}.thumbnail{width:50px;height:40px}.project-description{max-width:190px}.editor-grid{display:block}.editor-grid>.panel{margin-bottom:16px}.browser-page{padding:16px}button{min-height:40px}.card-top button{min-height:28px}.review button{min-height:30px}.review select{max-width:155px;padding:5px}.motion-demo .moving.moved{transform:translateX(35px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="review"><strong>MOCKUP · PROBATOR</strong><select aria-label="Schermata mockup" id="screen"><option value="projects">Panoramica progetti</option><option value="board">Board dei test</option><option value="editor">Editor test</option><option value="execution">Esito e replay</option><option value="live">Esecuzione live</option><option value="history">Cronologia</option><option value="motion">Stile e animazioni</option></select><button id="theme">Tema scuro</button><span class="note">Dati dimostrativi · interazioni locali</span></div>
<div class="shell">
<aside><a class="brand" href="#projects">probator<b>.</b></a><div class="workspace flex"><span class="avatar">S</span><div><strong>Studio workspace</strong><div class="small muted">Ambiente di sviluppo</div></div></div><nav><div class="nav-label">Workspace</div><button data-go="projects">▦ &nbsp; Progetti <span>4</span></button></nav><nav><div class="nav-label">Progetto attivo</div><div class="flex" style="padding:0 12px 12px"><span class="avatar">A</span><strong>Acme Store</strong></div><button data-go="board">▤ &nbsp; Board dei test <span>7</span></button><button data-go="history">◷ &nbsp; Esecuzioni <span>12</span></button><button data-go="editor">≡ &nbsp; Definizione test</button></nav><div class="aside-bottom small muted">Browser worker <span class="badge passed">● Disponibile</span><p style="margin-top:12px">Locale · staging</p></div></aside>
<div><header class="topbar"><div class="crumb" id="breadcrumb"></div><div class="flex user"><span class="muted">Studio workspace</span><span class="avatar">MR</span></div></header><main id="content"></main></div></div>
<div class="toast" role="status" id="toast" hidden></div>
<script>
const content=document.getElementById('content');
const screen=document.getElementById('screen');
const badge=(state,text)=>`<span class="badge ${state}">${{passed:'✓',failed:'×',running:'◷',blocked:'!'}[state]||'–'} ${text}</span>`;
const header=(title,description,actions='')=>`<div class="heading"><div><h1>${title}</h1><p class="muted">${description}</p></div><div class="flex wrap">${actions}</div></div>`;
const tabs=(active)=>`<div class="tabs"><button data-go="board" class="${active==='board'?'active':''}">Board dei test</button><button data-go="history" class="${active==='history'?'active':''}">Esecuzioni</button><button data-action="info">Dettagli progetto</button></div>`;
const projects=[['Acme Store','store.acme.test','Checkout, catalogo e area clienti','7 test','failed','1 da verificare'],['Atlas Console','console.atlas.test','Gestione account e permessi','12 test','passed','Ultima esecuzione superata'],['Forma Studio','forma.test','Sito pubblico e richieste di contatto','5 test','passed','Ultima esecuzione superata'],['North Portal','portal.north.test','Accesso e documenti del cliente','8 test','blocked','1 esecuzione bloccata']];
function projectsView(){return header('Progetti','Tutti i siti e le applicazioni del workspace.','<button class="primary" data-action="new-project">+ Nuovo progetto</button>')+`<div class="toolbar"><input class="search" id="project-search" placeholder="Cerca per nome o URL…" aria-label="Cerca progetti"><span class="small muted count" id="project-count">4 progetti</span></div><div class="table-wrap"><table><thead><tr><th>Progetto</th><th class="project-url">URL</th><th class="project-stats">Test</th><th>Ultimo esito</th></tr></thead><tbody id="project-rows">${projectRows(projects)}</tbody></table><div class="project-footer">Anteprime illustrative · aggiornamento al termine dell'acquisizione</div></div>`}
function projectRows(rows){return rows.map(p=>`<tr><td><div class="project-name"><div class="thumbnail" aria-hidden="true"><div><i></i><i></i><i></i></div></div><div><a class="project-link" href="#board">${p[0]}</a><div class="project-description">${p[2]}</div></div></div></td><td class="mono muted project-url">${p[1]}</td><td class="small project-stats">${p[3]}</td><td>${badge(p[4],p[5])}</td></tr>`).join('')}
let cards=[{id:'T-014',title:'Completare un ordine con carta',tags:['checkout','regressione'],state:'failed',label:'Fallita',time:'Oggi, 10:42',col:0},{id:'T-018',title:'Filtrare il catalogo per categoria',tags:['catalogo'],state:'',label:'Mai eseguito',time:'4 step',col:0},{id:'T-021',title:'Navigare il checkout da tastiera',tags:['accessibilità'],state:'blocked',label:'Bloccata',time:'Ieri, 16:20',col:0},{id:'T-009',title:'Applicare un codice promozionale',tags:['checkout'],state:'running',label:'In corso',time:'Step 2 di 4',col:1},{id:'T-011',title:'Aggiornare l’indirizzo di consegna',tags:['account'],state:'passed',label:'Superata',time:'Ieri, 15:08',col:1},{id:'T-003',title:'Accedere con un account valido',tags:['autenticazione'],state:'passed',label:'Superata',time:'Oggi, 09:14',col:2},{id:'T-005',title:'Aggiungere un prodotto al carrello',tags:['catalogo','checkout'],state:'passed',label:'Superata',time:'Oggi, 09:18',col:2}];
function card(c){return `<article class="test-card"><div class="flex spread card-top"><span class="mono">${c.id}</span><button class="quiet" data-move="${c.id}" aria-label="Sposta ${c.title}">↪ Sposta</button></div><h3><a href="#${c.id==='T-009'?'live':'editor'}">${c.title}</a></h3><div class="flex wrap">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="card-meta flex spread">${c.state?badge(c.state,c.label):`<span class="small muted">– ${c.label}</span>`}<span class="small muted">${c.time}</span></div><div class="flex spread small" style="margin-top:9px"><a href="#history" class="muted">Cronologia ↗</a><a href="#${c.id==='T-009'?'live':'execution'}">Apri esecuzione →</a></div></article>`}
function boardView(){return header('Acme Store','store.acme.test · Checkout, catalogo e area clienti','<button data-go="history">◷ Cronologia</button><button class="primary" data-go="editor">+ Nuovo test</button>')+tabs('board')+`<div class="toolbar"><input class="search" id="test-search" placeholder="Cerca test…" aria-label="Cerca test"><select id="label-filter" aria-label="Filtra per etichetta"><option value="">Tutte le etichette</option><option>checkout</option><option>accessibilità</option><option>catalogo</option></select><span class="count muted small">7 test · 1 in esecuzione</span></div><select class="mobile-column" aria-label="Colonna board" id="column-select"><option value="0">Da fare</option><option value="1">In corso</option><option value="2">Completato</option></select><div class="board" id="board-columns">${columns(cards)}</div><p class="board-tip">Le colonne indicano lo stato del lavoro. Il badge sulla card indica l'esito dell'esecuzione.</p>`}
function columns(items){return ['Da fare','In corso','Completato'].map((n,i)=>`<section class="column ${i===0?'mobile-active':''}" data-col="${i}"><div class="column-title"><span>${n}<span class="number">${items.filter(c=>c.col===i).length}</span></span><span class="muted">···</span></div>${items.filter(c=>c.col===i).map(card).join('')}<button class="add" data-go="editor">+ Aggiungi test</button></section>`).join('')}
function editorView(){return header('Completare un ordine con carta','T-014 · Acme Store · Definizione del test','<button data-go="board">Annulla</button><button class="primary" data-action="save">Salva test</button>')+`<div class="editor-grid"><section class="panel"><h2>Obiettivo</h2><label class="field">Titolo<input value="Completare un ordine con carta"></label><label class="field">Descrizione<textarea>Verificare che un cliente possa acquistare un prodotto e visualizzare la conferma dell’ordine.</textarea></label><div class="flex spread"><h2>Step del test</h2><span class="small muted">3 step obbligatori</span></div>${[['Aggiungere un prodotto al carrello','Il carrello contiene il prodotto selezionato.'],['Inserire i dati di consegna','Il riepilogo mostra l’indirizzo inserito.'],['Confermare il pagamento con carta','Compare il pulsante “Paga ora”, poi la conferma dell’ordine.']].map((s,i)=>`<div class="step-editor"><span class="step-number">${i+1}</span><div><label class="field">Istruzione<input value="${s[0]}"></label><label class="field">Risultato atteso<textarea>${s[1]}</textarea></label><span class="tag">Obbligatorio</span></div></div>`).join('')}<button data-action="add-step">+ Aggiungi step</button><div class="final-checks"><h2>Controlli finali</h2><label class="field">Testo visibile<input value="Ordine confermato"></label><label class="field">URL finale contiene<input value="/order/confirmation"></label></div></section><section><div class="panel"><h2>Organizzazione</h2><label class="field">Stato di lavoro<select><option>Da fare</option><option>In corso</option><option>Completato</option></select></label><div class="field">Etichette<div class="flex" style="margin-top:8px"><span class="tag">checkout</span><span class="tag">regressione</span></div></div><p class="small muted">Le etichette classificano il test e non rappresentano il suo esito.</p></div><div class="panel" style="margin-top:16px"><h2>Avvia un tentativo</h2><label class="field">Modalità<select id="run-mode"><option value="live">Live</option><option value="execution">Registrazione rrweb</option></select></label><button class="primary" data-action="run">▶ Avvia test</button><p class="definition-note">Ogni avvio salva una copia della definizione e crea una nuova esecuzione.</p></div></section></div>`}
function evidence(live){return `<div class="tabs evidence-tabs"><button class="active" data-evidence="replay">${live?'Vista live':'Replay rrweb'}</button><button data-evidence="screenshot">Screenshot</button><button data-evidence="log">Log</button></div><div id="evidence-body"><div class="browser-bar"><span class="browser-dot"></span><span class="mono">store.acme.test/checkout/payment</span></div><div class="browser-page"><div class="store-head">ACME / STORE <span style="float:right" class="muted">Carrello (1)</span></div><div class="order-box"><h3>${live?'Codice promozionale':'Riepilogo ordine'}</h3><div class="order-item"><div class="item-square"></div><div><strong>Everyday tote</strong><p class="small muted">Natural · Quantità 1</p><p>€ 48,00</p></div></div>${live?'<label class="field">Codice<input value="WELCOME10" readonly></label><span class="badge passed">✓ Codice applicato</span>':'<div class="order-total flex spread"><span>Totale</span><strong>€ 52,90</strong></div><div class="unavailable small">Metodo di pagamento non disponibile</div>'}</div></div><div class="player"><div class="timeline"></div><div class="flex spread"><div class="flex"><button data-action="play" aria-label="Riproduci replay">▶</button><span class="mono">00:34 / 00:47</span></div><span class="small muted">${live?'Live · osservazione attuale':'1× · input mascherati'}</span></div></div></div><p class="evidence-caption">${live?'La vista osserva il worker. L’esecuzione continua anche chiudendo questa pagina.':'Prova dello step 3 · Dati dimostrativi · Nessuna causa tecnica dedotta dal replay.'}</p>`}
function executionView(live=false){return header(live?'Applicare un codice promozionale':'Completare un ordine con carta',live?'T-009 · Esecuzione EX-043 · Acme Store':'T-014 · Esecuzione EX-042 · Acme Store',`<button data-go="history">← Cronologia</button>${!live?'<button class="primary" data-go="editor">↻ Nuovo tentativo</button>':''}`)+`<div class="execution-summary"><div><span>Esito</span>${badge(live?'running':'failed',live?'In corso':'Fallita')}</div><div><span>Modalità</span>${live?'Live':'Registrazione'}</div><div><span>Avvio · 8 ottobre 2026</span>${live?'10:48:12':'10:42:08'}</div><div><span>Durata</span>${live?'18 s':'47 s'}</div><div><span>Ambiente</span><code>staging</code></div></div>${live?'<div class="live-mark">◷ Step 2 di 4 · Verifica dello sconto applicato. Ultimo aggiornamento: adesso.</div>':''}<div class="execution-grid"><section class="panel"><h2>Risultati per step</h2><div class="result-row"><span class="step-number">1</span><span>Aggiungere un prodotto al carrello</span>${badge('passed','Superato')}</div><div class="result-row"><span class="step-number">2</span><span>${live?'Applicare il codice WELCOME10':'Inserire i dati di consegna'}</span>${badge(live?'running':'passed',live?'In corso':'Superato')}</div><div class="result-row"><span class="step-number">3</span><span>${live?'Verificare il totale':'Confermare il pagamento'}</span>${live?'<span class="small muted">In attesa</span>':badge('failed','Fallito')}</div>${live?'<div class="result-row"><span class="step-number">4</span><span>Confermare il riepilogo</span><span class="small muted">In attesa</span></div>':''}${!live?`<div class="result-detail"><dl><dt>ATTESO</dt><dd>Il pulsante “Paga ora” è disponibile.</dd><dt>OSSERVATO</dt><dd>Il pulsante non è comparso entro il timeout di 15 secondi. È visibile “Metodo di pagamento non disponibile”.</dd><dt>CAUSA</dt><dd>Non determinata. Non sono disponibili prove sufficienti per attribuire il problema al server.</dd></dl><div class="flex" style="margin-top:12px"><span class="tag">Screenshot</span><span class="tag">Replay · 00:34</span></div></div>`:''}<div class="final-checks"><h2>Controlli finali</h2><div class="result-row"><span>Testo “Ordine confermato”</span>${live?'<span class="small muted">In attesa</span>':badge('blocked','Non verificabile')}</div><div class="result-row"><span>URL di conferma</span>${live?'<span class="small muted">In attesa</span>':badge('blocked','Non verificabile')}</div></div><p class="small muted" style="margin-top:18px">${live?'Le verifiche finali iniziano dopo gli step obbligatori.':'Definizione acquisita all’avvio · versione 3. Il fallimento dello step obbligatorio determina l’esito.'}</p></section><section class="panel"><div class="flex spread"><h2>Prove dell’esecuzione</h2><span class="tag">${live?'EX-043':'EX-042'}</span></div>${evidence(live)}</section></div>`}
function historyView(){return header('Esecuzioni','Acme Store · Ogni tentativo conserva risultati e prove.','<button data-go="board">← Board dei test</button>')+tabs('history')+`<div class="toolbar"><input class="search" placeholder="Cerca per test o ID…" id="history-search" aria-label="Cerca esecuzioni"><select id="history-filter" aria-label="Filtra esito"><option value="">Tutti gli esiti</option><option value="failed">Fallita</option><option value="passed">Superata</option><option value="running">In corso</option></select><span class="count small muted">12 esecuzioni</span></div><div class="table-wrap"><table><thead><tr><th>Test / esecuzione</th><th>Esito</th><th>Modalità</th><th>Avvio</th><th>Durata</th></tr></thead><tbody id="history-rows">${historyRows()}</tbody></table></div><div class="notice">La definizione può cambiare nel tempo. Ogni risultato fa riferimento alla versione del test salvata al momento dell’avvio.</div>`}
function historyRows(){return [['EX-043','Applicare un codice promozionale','running','In corso','Live','10:48','18 s'],['EX-042','Completare un ordine con carta','failed','Fallita','Registrazione','10:42','47 s'],['EX-041','Completare un ordine con carta','passed','Superata','Live','09:32','38 s'],['EX-040','Aggiungere un prodotto al carrello','passed','Superata','Registrazione','09:18','12 s'],['EX-039','Accedere con un account valido','passed','Superata','Live','09:14','21 s']].map(r=>`<tr data-status="${r[2]}"><td><a class="project-link" href="#${r[2]==='running'?'live':'execution'}">${r[1]}</a><p class="small mono muted">${r[0]} · 8 ottobre 2026</p></td><td>${badge(r[2],r[3])}</td><td>${r[4]}</td><td class="mono">${r[5]}</td><td class="mono">${r[6]}</td></tr>`).join('')}
function motionView(){return header('Stile e animazioni','Gli stessi token governano tutte le schermate.','<label class="small flex"><input type="checkbox" id="reduce"> Movimento ridotto</label>')+`<div class="motion-grid"><section class="panel"><span class="doc-label">Interazione · 120 ms</span><h2>Pulsanti e selezione</h2><div class="motion-demo"><button class="primary" data-action="feedback">Avvia test</button></div><p class="small muted">Colore e bordo. Nessuno spostamento del pulsante o del layout.</p></section><section class="panel"><span class="doc-label">Apertura · 180 ms</span><h2>Menu contestuale</h2><div class="motion-demo" id="menu-demo"><button data-action="menu">Apri menu ↓</button></div><p class="small muted">Opacità + 4 px. Easing di ingresso condiviso; focus sempre visibile.</p></section><section class="panel"><span class="doc-label">Riassetto · 180 ms</span><h2>Spostamento card</h2><div class="motion-demo"><div class="moving" id="moving">T-014<br><span class="small muted">Checkout</span></div></div><button data-action="move-demo">Sposta card →</button></section><section class="panel"><span class="doc-label">Stati semantici</span><h2>Esiti e classificazione</h2><div class="flex wrap" style="margin:20px 0">${badge('passed','Superata')}${badge('failed','Fallita')}${badge('blocked','Bloccata')}${badge('running','In corso')}</div><span class="tag">checkout</span><p class="small muted" style="margin-top:12px">Icona e testo accompagnano il colore. Le etichette restano neutre.</p></section><section class="panel"><span class="doc-label">Superfici e densità</span><h2>Gerarchia compatta</h2><div class="motion-demo"><div><strong>Titolo del test · 14 px</strong><p class="small muted">Metadati e timestamp · 12 px</p><code class="mono">EX-042 / staging</code></div></div><p class="small muted">Bordi 1 px · raggi 4–6 px · spaziatura su scala 4 px.</p></section><section class="panel"><span class="doc-label">Accessibilità</span><h2>Movimento ridotto</h2><p class="small muted" style="margin:20px 0">La preferenza di sistema elimina traslazioni e animazioni non necessarie. Il feedback rimane leggibile.</p><p class="small">Nessun loop decorativo.<br>Nessun blocco dell’interazione.<br>Nessuna animazione globale di pagina.</p></section></div>`}
function show(name){if(!['projects','board','editor','execution','live','history','motion'].includes(name))name='projects';screen.value=name;content.innerHTML=({projects:projectsView,board:boardView,editor:editorView,execution:executionView,live:()=>executionView(true),history:historyView,motion:motionView})[name]();document.getElementById('breadcrumb').innerHTML=name==='projects'?'<span>Workspace</span><span>/</span><b>Progetti</b>':`<a href="#projects">Progetti</a><span>/</span><a href="#board">Acme Store</a><span>/</span><b>${screen.selectedOptions[0].textContent}</b>`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.go===name));bind();}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2400)}
function bind(){document.getElementById('project-search')?.addEventListener('input',e=>{const rows=projects.filter(p=>p.join(' ').toLowerCase().includes(e.target.value.toLowerCase()));document.getElementById('project-rows').innerHTML=rows.length?projectRows(rows):'<tr><td colspan="4" class="empty">Nessun progetto trovato.</td></tr>';document.getElementById('project-count').textContent=rows.length+' progetti'});const filter=()=>{const q=document.getElementById('test-search').value.toLowerCase(),tag=document.getElementById('label-filter').value;document.getElementById('board-columns').innerHTML=columns(cards.filter(c=>c.title.toLowerCase().includes(q)&&(!tag||c.tags.includes(tag))));applyColumn()};document.getElementById('test-search')?.addEventListener('input',filter);document.getElementById('label-filter')?.addEventListener('change',filter);document.getElementById('column-select')?.addEventListener('change',applyColumn);document.getElementById('reduce')?.addEventListener('change',e=>document.body.classList.toggle('reduced',e.target.checked));const historyFilter=()=>document.querySelectorAll('#history-rows tr').forEach(r=>r.hidden=(!r.textContent.toLowerCase().includes(document.getElementById('history-search').value.toLowerCase())||(document.getElementById('history-filter').value&&r.dataset.status!==document.getElementById('history-filter').value)));document.getElementById('history-search')?.addEventListener('input',historyFilter);document.getElementById('history-filter')?.addEventListener('change',historyFilter)}
function applyColumn(){const n=document.getElementById('column-select')?.value||'0';document.querySelectorAll('.column').forEach(c=>c.classList.toggle('mobile-active',c.dataset.col===n))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){location.hash=b.dataset.go;return}if(b.dataset.move){const c=cards.find(c=>c.id===b.dataset.move);c.col=(c.col+1)%3;show('board');toast('Stato di lavoro aggiornato. Esito dell’esecuzione invariato.');return}if(b.dataset.evidence){document.querySelectorAll('[data-evidence]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.evidence==='log')document.getElementById('evidence-body').innerHTML='<pre class="mono" style="white-space:pre-wrap">10:42:34 · Step 3 iniziato\n10:42:49 · Timeout: pulsante atteso non osservato\n10:42:49 · Screenshot salvato\n10:42:55 · Esito: failed\n\nIpotesi causali: nessuna confermata.</pre>';else{document.getElementById('evidence-body').innerHTML=evidence(screen.value==='live').split('<div id="evidence-body">')[1].split('<p class="evidence-caption">')[0];if(b.dataset.evidence==='screenshot')document.querySelector('.player')?.remove()}return}switch(b.dataset.action){case 'save':toast('Definizione salvata nel mockup. Nessuna persistenza reale.');break;case 'run':location.hash=document.getElementById('run-mode').value;break;case 'play':toast('Anteprima illustrativa: nessuna registrazione reale caricata.');break;case 'info':toast('Acme Store · https://store.acme.test · ambiente staging');break;case 'new-project':toast('Il flusso di creazione progetto è previsto nel piano.');break;case 'add-step':toast('Nel prodotto gli step saranno aggiungibili e riordinabili.');break;case 'feedback':toast('Feedback immediato · 120 ms');break;case 'menu':document.getElementById('menu-demo').innerHTML='<div class="motion-menu">Sposta in In corso<br><span class="muted small">Apri cronologia</span></div>';break;case 'move-demo':document.getElementById('moving').classList.toggle('moved');break}});
screen.addEventListener('change',()=>location.hash=screen.value);document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme').textContent=dark?'Tema chiaro':'Tema scuro'});window.addEventListener('hashchange',()=>show(location.hash.slice(1)));const params=new URLSearchParams(location.search);if(params.get('theme')==='dark'){document.documentElement.dataset.theme='dark';document.getElementById('theme').textContent='Tema chiaro'}show(location.hash.slice(1)||'projects');
</script>
</body>
